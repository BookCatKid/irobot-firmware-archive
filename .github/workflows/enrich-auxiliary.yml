name: Enrich embedded auxiliary firmware

on:
  workflow_dispatch:
    inputs:
      family:
        description: "Optional parent firmware family; blank enriches every missing bundle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: firmware-catalog
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      head_sha: ${{ steps.matrix.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - id: matrix
        run: python scripts/auxiliary_matrix.py prepare --family '${{ inputs.family }}' --github-output "$GITHUB_OUTPUT"

  enrich:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install extractor and archive CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          python -m pip install -e .
      - name: Reanalyze archived parent firmware
        run: >-
          python scripts/auxiliary_matrix.py enrich
          --index '${{ matrix.item.index }}'
          --expected-id '${{ matrix.item.id }}'
      - uses: actions/upload-artifact@v5
        with:
          name: auxiliary-result-${{ matrix.item.id }}
          path: _auxiliary_result
          if-no-files-found: error
          retention-days: 3

  finalize:
    needs: [prepare, enrich]
    if: always() && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v6
        with:
          pattern: auxiliary-result-*
          path: _auxiliary_results
          merge-multiple: true
      - name: Merge successful nested analyses
        run: python scripts/auxiliary_matrix.py merge --results-dir _auxiliary_results
      - name: Rebuild embedded auxiliary firmware index
        run: python scripts/build_auxiliary_index.py
      - name: Commit enriched manifests and index
        run: |
          git config user.name "irobot-firmware-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/firmware data/auxiliary-firmware.json
          if git diff --cached --quiet; then
            echo "No auxiliary analysis changes"
          else
            git commit -m "analysis: enrich embedded auxiliary firmware"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
