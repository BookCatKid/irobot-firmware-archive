name: Check for iRobot firmware

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      archive_now:
        description: "Archive newly discovered/pending packages during this run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: firmware-catalog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Validate catalog JSON
        run: python -m json.tool data/catalog.json >/dev/null
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install extractor
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Install archive CLI
        run: python -m pip install -e .
      - name: Discover currently exposed firmware
        run: irobot-fw discover
      - name: Archive pending firmware
        if: ${{ vars.IROBOT_ARCHIVE_ENABLED == 'true' || inputs.archive_now == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: irobot-fw archive --repo "$GITHUB_REPOSITORY"
      - name: Rebuild embedded auxiliary firmware index
        run: python scripts/build_auxiliary_index.py
      - name: Rebuild embedded audio index
        run: python scripts/build_audio_index.py
      - name: Snapshot official release-note evidence
        run: python scripts/snapshot_release_note_evidence.py
      - name: Disposition unresolved official release evidence
        run: python scripts/build_gap_dispositions.py --allow-undispositioned
      - name: Rebuild completeness ledger
        run: python scripts/build_completeness_ledger.py
      - name: Verify archived Release integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_release_integrity.py --repo "$GITHUB_REPOSITORY"
      - name: Commit catalog and manifests
        run: |
          git config user.name "irobot-firmware-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/firmware data/auxiliary-firmware.json data/audio-assets.json data/completeness.json data/research/official-release-note-artifact-gaps-current.json data/research/official-gap-dispositions-current.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "archive: update firmware catalog"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
